# Lock-screen colors and still frame are regenerated from the active wallpaper.
source = ~/.config/hypr/current_theme/colors.conf
$lock_text = rgba(255, 255, 255, 1.0)

background {
    monitor =
    path = /home/levi/.config/hypr/current_wallpaper
    blur_passes = 2
    blur_size = 4
    noise = 0.01
    contrast = 0.92
    brightness = 0.68
    vibrancy = 0.18
    vibrancy_darkness = 0.12
}

general {
    hide_cursor = true
}

label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = $lock_text
    font_size = 112
    font_family = $font_family_bold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $background
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A  ·  %B %-d"
    color = $lock_text
    font_size = 22
    font_family = $font_family_bold
    position = 0, 102
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    outer_color = $border
    inner_color = $surface
    font_color = $lock_text
    fade_on_empty = false
    rounding = 14
    check_color = $secondary
    fail_color = $critical
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -54
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] artist="$(playerctl metadata artist 2>/dev/null)"; title="$(playerctl metadata title 2>/dev/null)"; if [ -n "$title" ]; then if [ -n "$artist" ]; then echo "󰎆  $artist  ·  $title"; else echo "󰎆  $title"; fi; fi
    color = $lock_text
    font_size = 14
    font_family = $font_family
    position = 0, -132
    halign = center
    valign = center
}
