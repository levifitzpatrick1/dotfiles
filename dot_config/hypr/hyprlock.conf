# Material 3 Expressive Hyprlock Configuration
# Beautifully integrated with the active theme, dynamic fonts, and dynamic media player

# Load active theme colors and font variables
source = ~/.config/hypr/current_theme/colors.conf

# Fallback font families if undefined by the theme colors.conf
$font_family = Comfortaa
$font_family_bold = Comfortaa Bold

background {
    monitor =
    path = /home/levi/.config/hypr/current_wallpaper # Dynamic symlink to current wallpaper
    blur_passes = 3 # Premium glassmorphic background blur
    blur_size = 7
    noise = 0.015
    contrast = 0.89
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    hide_cursor = true
    grace = 0
}

# TIME (Large Expressive M3 Clock)
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(208, 188, 255, 0.9) # Soft Lavender Accent (M3 Primary)
    font_size = 110
    font_family = $font_family_bold # Dynamically loaded from active theme colors.conf!
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# DATE (Elegant Subtitle)
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgba(230, 225, 229, 0.8) # M3 Soft White text
    font_size = 20
    font_family = $font_family # Dynamically loaded from active theme colors.conf!
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# USER STATUS ICON
label {
    monitor =
    text = 󰌾  Locked
    color = rgba(208, 188, 255, 0.55) # Translucent primary accent
    font_size = 14
    font_family = $font_family # Dynamically loaded from active theme colors.conf!
    position = 0, 30
    halign = center
    valign = center
}

# INPUT FIELD (Rounded capsule with M3 border and background)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(208, 188, 255, 0.45) # Soft lavender outline
    inner_color = rgba(7, 0, 31, 0.5) # Midnight dark transparent background
    font_color = rgb(230, 225, 229)
    fade_on_empty = false
    rounding = 9999 # Fully circular M3 capsule shape
    check_color = rgba(208, 188, 255, 0.8)
    fail_color = rgb(243, 139, 168) # M3 Critical Red
    placeholder_text = <i><span foreground="##cac4d0">Enter Password...</span></i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# CURRENT PLAYING MEDIA (Beautiful Material 3 Capsule Style)
label {
    monitor =
    text = cmd[update:1000] artist_title="$(playerctl metadata --format '{{title}}  •  {{artist}}' 2>/dev/null | tr -d '\n')"; if [ -z "$artist_title" ]; then echo "󰎊  No Media Playing"; else echo "󰎆  $artist_title"; fi
    color = rgba(208, 188, 255, 0.75) # Lavender accent for playing text
    font_size = 13
    font_family = $font_family_bold
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}
