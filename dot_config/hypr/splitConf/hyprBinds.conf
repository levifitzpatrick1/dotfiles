# Material 3 Expressive Unified Key Bindings

# Modifier keys
$mainMod = ALT

# Applications & Command Palette
bind = $mainMod, Return, exec, ghostty                                   # Terminal
bind = $mainMod, Space, exec, qs ipc call launcher toggle                 # Custom App Launcher / Cmd Palette
bind = $mainMod, Escape, exec, qs ipc call controlcenter toggle          # Control Center
bind = $mainMod, E, exec, dolphin                                        # File Manager
bind = $mainMod, B, exec, xdg-open https://duckduckgo.com/               # Web Browser
bind = $mainMod, L, exec, hyprlock                                       # Lock screen

# Window Management
bind = $mainMod, C, killactive,                                          # Close Window
bind = $mainMod, V, togglefloating,                                      # Float Window
bind = $mainMod, F, fullscreen,                                          # Fullscreen Active Window
bind = $mainMod, P, pseudo,                                              # Dwindle Pseudo
bind = $mainMod, J, layoutmsg, togglesplit,                              # Dwindle Split Toggle

# Special Workspace Toggles
bind = $mainMod, N, togglespecialworkspace, scratchpad                   # Floating Todo Notes
bind = $mainMod SHIFT, N, movetoworkspacesilent, special:scratchpad
bind = $mainMod, S, togglespecialworkspace, spotify                      # Spotify Media
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:spotify

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace Switching (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace (1-10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Active Window Resizing
binde = $mainMod SHIFT, right, resizeactive, 30 0
binde = $mainMod SHIFT, left, resizeactive, -30 0
binde = $mainMod SHIFT, up, resizeactive, 0 -30
binde = $mainMod SHIFT, down, resizeactive, 0 30

# Mouse Bindings (Drag/Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Discord Global Shortcuts (Mute/Deafen)
bind = , F23, pass, class:^discord$
bind = , F24, pass, class:^discord$

# System Volume controls (Auto-triggers Quickshell's native PwTracker OSD)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Touchpad/Screen Backlight brightness controls (Manually triggers Quickshell OSD)
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && qs ipc call osd showBrightness $(brightnessctl -m | cut -d, -f4 | tr -d %)
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && qs ipc call osd showBrightness $(brightnessctl -m | cut -d, -f4 | tr -d %)

# Caps Lock & Num Lock state listener hooks (Triggers center/bottom OSD)
bindl = , Caps_Lock, exec, sleep 0.15 && qs ipc call lockosd showCaps $(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .capsLock')
bindl = , Num_Lock, exec, sleep 0.15 && qs ipc call lockosd showNum $(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .numLock')
