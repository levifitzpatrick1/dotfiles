# Baseline Hardware Inputs & Device Controls
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = -0.6 # Smooth, controllable pointer speed baseline

    touchpad {
        natural_scroll = false
    }
}

# Per-device input overrides for Logitech G600 High-DPI Gaming Mouse
device {
    name = logitech-gaming-mouse-g600
    sensitivity = -0.5 # 1:1 pixel perfect tracking
    accel_profile = flat # Flat response curve
}
