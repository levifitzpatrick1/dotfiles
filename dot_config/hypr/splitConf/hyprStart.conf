# Core Wayland and System Portal autostarts
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/bin/kwalletd6
exec-once = /usr/lib/pam_kwallet_init

# Immediate lock screen on startup (for clean boots into hyprlock)
exec-once = hyprlock

# Autostart essential background services with robust startup delays (prevents race conditions)
exec-once = sleep 1 && dunst &                                       # Notification manager
exec-once = sleep 2 && quickshell --path ~/.config/quickshell/shell.qml & # Material 3 Expressive Suite
exec-once = sleep 3 && kwrite ~/.config/quickshell/scratchpad.md &   # Launch scratchpad editor in special workspace
exec = pkill hyprpaper; sleep 1 && hyprpaper &                      # Space wallpaper manager
exec-once = sleep 1 && hypridle &                                    # Power management and screen blanker
