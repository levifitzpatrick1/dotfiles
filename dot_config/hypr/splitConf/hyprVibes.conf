# Material 3 Expressive Look & Feel Configuration
# Consolidated theme design parameters

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg # Soft pastel blue to lavender gradient
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10

    # Glassmorphism blurring
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        brightness = 1.0
        contrast = 1.0
        noise = 0.02
    }

    # Depth shadows
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Premium, Snappy Spring Animations
animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = easeInOut, 0.65, 0, 0.35, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, easeInOut
    animation = border, 1, 10, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, overshot, slide
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
