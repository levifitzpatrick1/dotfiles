# Window and Layer Rules (Aesthetic & Workspace Controls)

# Battle.net empty helper windows (prevents blank/ghost windows in top-left)
windowrule = workspace special:silent, match:class ^(steam_app_0)$, match:title ^$

# Spotify Rules (auto-route to scratchpad, toggle with Super+S)
windowrule = workspace special:spotify, match:class ^[Ss]potify$
windowrule = float 1, match:class ^[Ss]potify$
windowrule = size 1200 800, match:class ^[Ss]potify$
windowrule = center 1, match:class ^[Ss]potify$

# Markdown Scratchpad Rules (auto-route to special scratchpad, toggle with Super+N)
windowrule = workspace special:scratchpad, match:class ^org\.kde\.kwrite$
windowrule = float 1, match:class ^org\.kde\.kwrite$
windowrule = size 1200 800, match:class ^org\.kde\.kwrite$
windowrule = center 1, match:class ^org\.kde\.kwrite$

# Text Editors / Notepad Rules (Kate, KWrite, Gedit, Mousepad, Leafpad, Notepadqq)
windowrule = float 1, match:class ^(org\.kde\.kate|kwrite|mousepad|gedit|notepad|notepadqq)$
windowrule = size 1200 800, match:class ^(org\.kde\.kate|kwrite|mousepad|gedit|notepad|notepadqq)$
windowrule = center 1, match:class ^(org\.kde\.kate|kwrite|mousepad|gedit|notepad|notepadqq)$

windowrule = float 1, match:title ^.*[Nn]otepad.*$
windowrule = size 1200 800, match:title ^.*[Nn]otepad.*$
windowrule = center 1, match:title ^.*[Nn]otepad.*$

# General Floating Dialog / Toast Rules
windowrule = float 1, match:title ^(Open File|Save File|Volume Control)$

# Layer rules for custom panel glassmorphism blur
layerrule {
    name = quickshell_blur
    match:namespace = ^quickshell(-bar)?$
    blur = on
    ignore_alpha = 0
}
