# Sleek Minimalist Starship Configuration
# Designed for maximum focus and a clean, compact terminal layout

# Single-line prompt layout
format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

# Disable the blank line at the start of the prompt
add_newline = false

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "

# Disable verbose packaging info
[package]
disabled = true

# Keep language runtimes compact and clean
[nodejs]
format = "via [ $version](bold green) "

[python]
format = "via [ $version](bold yellow) "

[rust]
format = "via [󱘗 $version](bold red) "
